<body style="margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; font-family: sans-serif;">


  <div style="display: flex; gap: 10px; align-items: center;">
    <input type="number" id="width-input" placeholder="Width" style="padding: 8px; width: 80px;">
    <span>x</span>
    <input type="number" id="height-input" placeholder="Height" style="padding: 8px; width: 80px;">
    <button id="submit-btn" style="padding: 8px 16px; background-color: #0a005f; color: white; border: none; cursor: pointer; font-weight: bold;">Submit</button>
  </div>


  <div id="my-box" style="width: 500px; height: 350px; background-color: #3498db; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; border: 5px solid #0a005f;">
    <span id="box-text">500 x 350</span>
  </div>


  <script src="script.js"></script>

</body>
